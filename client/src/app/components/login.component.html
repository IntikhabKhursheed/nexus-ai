<div class="relative min-h-screen overflow-hidden bg-[var(--bg)] text-[var(--text)]">
  <div class="absolute -top-20 -left-20 h-[320px] w-[320px] rounded-full bg-[radial-gradient(circle,rgba(91,92,226,0.18)_0%,transparent_70%)] pointer-events-none"></div>
  <div class="absolute -bottom-16 -right-16 h-[260px] w-[260px] rounded-full bg-[radial-gradient(circle,rgba(15,155,142,0.14)_0%,transparent_70%)] pointer-events-none"></div>

  <div class="relative flex min-h-screen items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="rounded-[24px] border border-[var(--border)] bg-[var(--surface-strong)]/90 p-10 shadow-[var(--shadow)] backdrop-blur-xl">
        <div class="mb-8 flex items-center gap-4">
          <div class="flex h-9 w-9 items-center justify-center rounded-2xl bg-gradient-to-br from-[var(--primary)] to-[var(--accent)] shadow-[0_12px_40px_rgba(91,92,226,0.20)]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-white">
              <rect x="4" y="4" width="16" height="16" rx="5" fill="currentColor" opacity="0.18"/>
              <path d="M7 8h10M7 12h10M7 16h6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <p class="text-lg font-semibold text-[var(--text)]">Nexus AI</p>
            <p class="text-sm text-[var(--subtext)]">Task Management System</p>
          </div>
        </div>

        <h2 class="mb-2 text-3xl font-semibold text-[var(--text)]">Welcome back</h2>
        <p class="mb-8 text-sm text-[var(--subtext)]">Sign in to your workspace</p>

        <div class="mb-6 flex rounded-[12px] border border-[var(--border)] bg-[#f1f5f9] p-1">
          <button
            type="button"
            class="flex-1 rounded-[8px] px-4 py-2 text-sm font-semibold transition"
            [ngClass]="isLoginMode ? 'bg-[var(--primary)] text-white shadow-sm' : 'text-[var(--subtext)] hover:text-[var(--text)]'"
            (click)="onSwitchMode()"
          >
            Login
          </button>
          <button
            type="button"
            class="flex-1 rounded-[8px] px-4 py-2 text-sm font-semibold transition"
            [ngClass]="!isLoginMode ? 'bg-[var(--primary)] text-white shadow-sm' : 'text-[var(--subtext)] hover:text-[var(--text)]'"
            (click)="onSwitchMode()"
          >
            Register
          </button>
        </div>

        <form (ngSubmit)="onSubmit()">
          <div *ngIf="error" class="mb-4 rounded-[12px] border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
            {{ error }}
          </div>
          <div *ngIf="success" class="mb-4 rounded-[12px] border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">
            {{ success }}
          </div>

          <div *ngIf="!isLoginMode" class="mb-5">
            <label class="mb-2 block text-[11px] uppercase tracking-[0.4px] text-[var(--subtext)]">Username</label>
            <input
              type="text"
              [(ngModel)]="registerData.username"
              name="username"
              required
              class="w-full rounded-[12px] border border-[var(--border)] bg-white px-4 py-3 text-[var(--text)] placeholder:text-slate-400 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-[rgba(91,92,226,0.12)]"
              placeholder="Enter your username"
            />
          </div>

          <div class="mb-5">
            <label class="mb-2 block text-[11px] uppercase tracking-[0.4px] text-[var(--subtext)]">Email</label>
            <input
              type="email"
              [ngModel]="isLoginMode ? loginData.email : registerData.email"
              (ngModelChange)="isLoginMode ? loginData.email = $event : registerData.email = $event"
              name="email"
              required
              class="w-full rounded-[12px] border border-[var(--border)] bg-white px-4 py-3 text-[var(--text)] placeholder:text-slate-400 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-[rgba(91,92,226,0.12)]"
              placeholder="Enter your email"
            />
          </div>

          <div class="mb-1">
            <label class="mb-2 block text-[11px] uppercase tracking-[0.4px] text-[var(--subtext)]">Password</label>
            <input
              type="password"
              [ngModel]="isLoginMode ? loginData.password : registerData.password"
              (ngModelChange)="isLoginMode ? loginData.password = $event : registerData.password = $event"
              name="password"
              required
              class="w-full rounded-[12px] border border-[var(--border)] bg-white px-4 py-3 text-[var(--text)] placeholder:text-slate-400 outline-none transition focus:border-[var(--primary)] focus:ring-4 focus:ring-[rgba(91,92,226,0.12)]"
              placeholder="Enter your password"
            />
          </div>

          <div class="flex justify-end mb-6">
            <a class="text-[12px] text-[var(--primary)] hover:opacity-80" href="#">Forgot password?</a>
          </div>

          <button
            type="submit"
            [disabled]="isLoading"
            class="w-full rounded-[12px] bg-gradient-to-br from-[var(--primary)] to-[var(--accent)] px-4 py-3 text-sm font-semibold text-white shadow-[0_18px_40px_rgba(91,92,226,0.22)] transition hover:opacity-95 disabled:cursor-not-allowed disabled:opacity-60"
          >
            <span *ngIf="!isLoading">{{ isLoginMode ? 'Sign In' : 'Create Account' }}</span>
            <span *ngIf="isLoading" class="animate-pulse">Loading...</span>
          </button>

          <div class="mt-6 flex items-center gap-3">
            <span class="h-px flex-1 bg-[var(--border)]"></span>
            <span class="text-[12px] uppercase tracking-[0.4px] text-[var(--muted)]">or continue with</span>
            <span class="h-px flex-1 bg-[var(--border)]"></span>
          </div>

          <div class="mt-5 grid grid-cols-2 gap-3">
            <button
              type="button"
              class="flex items-center justify-center gap-2 rounded-[12px] border border-[var(--border)] bg-white px-4 py-3 text-sm font-medium text-[var(--subtext)] transition hover:border-[rgba(91,92,226,0.28)] hover:text-[var(--text)]"
            >
              <span class="inline-flex h-5 w-5 items-center justify-center rounded bg-slate-100 text-slate-700">G</span>
              Google
            </button>
            <button
              type="button"
              class="flex items-center justify-center gap-2 rounded-[12px] border border-[var(--border)] bg-white px-4 py-3 text-sm font-medium text-[var(--subtext)] transition hover:border-[rgba(91,92,226,0.28)] hover:text-[var(--text)]"
            >
              <span class="inline-flex h-5 w-5 items-center justify-center rounded bg-slate-100 text-slate-700">GH</span>
              GitHub
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
