<div class="relative min-h-screen overflow-hidden bg-[#0a0e1a]">
  <div class="absolute -top-20 -left-20 h-[320px] w-[320px] rounded-full bg-[radial-gradient(circle,rgba(99,60,220,0.35)_0%,transparent_70%)] pointer-events-none"></div>
  <div class="absolute -bottom-16 -right-16 h-[260px] w-[260px] rounded-full bg-[radial-gradient(circle,rgba(20,184,166,0.25)_0%,transparent_70%)] pointer-events-none"></div>

  <div class="relative flex min-h-screen items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="rounded-[20px] border border-[rgba(255,255,255,0.1)] bg-[rgba(255,255,255,0.04)] p-10 shadow-[0_30px_80px_rgba(0,0,0,0.35)] backdrop-blur-sm">
        <div class="mb-8 flex items-center gap-4">
          <div class="flex h-9 w-9 items-center justify-center rounded-2xl bg-gradient-to-br from-[#6b3fe6] to-[#5a32c7] shadow-[0_12px_40px_rgba(107,63,230,0.25)]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-white">
              <rect x="4" y="4" width="16" height="16" rx="5" fill="currentColor" opacity="0.18"/>
              <path d="M7 8h10M7 12h10M7 16h6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <p class="text-lg font-semibold text-white">Nexus AI</p>
            <p class="text-sm text-[rgba(255,255,255,0.45)]">Task Management System</p>
          </div>
        </div>

        <h2 class="text-3xl font-semibold text-white mb-2">Welcome back</h2>
        <p class="mb-8 text-sm text-[rgba(255,255,255,0.45)]">Sign in to your workspace</p>

        <div class="mb-6 rounded-[10px] bg-[rgba(255,255,255,0.06)] p-[3px] flex">
          <button
            type="button"
            class="flex-1 rounded-[8px] px-4 py-2 text-sm font-semibold transition"
            [ngClass]="isLoginMode ? 'bg-[rgba(107,63,230,0.7)] text-white' : 'text-[rgba(255,255,255,0.45)] hover:text-white'"
            (click)="onSwitchMode()"
          >
            Login
          </button>
          <button
            type="button"
            class="flex-1 rounded-[8px] px-4 py-2 text-sm font-semibold transition"
            [ngClass]="!isLoginMode ? 'bg-[rgba(107,63,230,0.7)] text-white' : 'text-[rgba(255,255,255,0.45)] hover:text-white'"
            (click)="onSwitchMode()"
          >
            Register
          </button>
        </div>

        <form (ngSubmit)="onSubmit()">
          <div *ngIf="!isLoginMode" class="mb-5">
            <label class="block text-[11px] uppercase tracking-[0.4px] text-[rgba(255,255,255,0.55)] mb-2">Username</label>
            <input
              type="text"
              [(ngModel)]="registerData.username"
              name="username"
              required
              class="w-full rounded-[10px] border border-[rgba(255,255,255,0.1)] bg-[rgba(255,255,255,0.06)] px-4 py-3 text-white placeholder-[rgba(255,255,255,0.25)] outline-none transition focus:border-[rgba(107,63,230,0.7)] focus:ring-1 focus:ring-[rgba(107,63,230,0.15)]"
              placeholder="Enter your username"
            />
          </div>

          <div class="mb-5">
            <label class="block text-[11px] uppercase tracking-[0.4px] text-[rgba(255,255,255,0.55)] mb-2">Email</label>
            <input
              type="email"
              [ngModel]="isLoginMode ? loginData.email : registerData.email"
              (ngModelChange)="isLoginMode ? loginData.email = $event : registerData.email = $event"
              name="email"
              required
              class="w-full rounded-[10px] border border-[rgba(255,255,255,0.1)] bg-[rgba(255,255,255,0.06)] px-4 py-3 text-white placeholder-[rgba(255,255,255,0.25)] outline-none transition focus:border-[rgba(107,63,230,0.7)] focus:ring-1 focus:ring-[rgba(107,63,230,0.15)]"
              placeholder="Enter your email"
            />
          </div>

          <div class="mb-1">
            <label class="block text-[11px] uppercase tracking-[0.4px] text-[rgba(255,255,255,0.55)] mb-2">Password</label>
            <input
              type="password"
              [ngModel]="isLoginMode ? loginData.password : registerData.password"
              (ngModelChange)="isLoginMode ? loginData.password = $event : registerData.password = $event"
              name="password"
              required
              class="w-full rounded-[10px] border border-[rgba(255,255,255,0.1)] bg-[rgba(255,255,255,0.06)] px-4 py-3 text-white placeholder-[rgba(255,255,255,0.25)] outline-none transition focus:border-[rgba(107,63,230,0.7)] focus:ring-1 focus:ring-[rgba(107,63,230,0.15)]"
              placeholder="Enter your password"
            />
          </div>

          <div class="flex justify-end mb-6">
            <a class="text-[12px] text-[rgba(107,63,230,0.9)] hover:text-white" href="#">Forgot password?</a>
          </div>

          <button
            type="submit"
            [disabled]="isLoading"
            class="w-full rounded-[10px] bg-gradient-to-br from-[#6b3fe6] to-[#5a32c7] px-4 py-3 text-sm font-semibold text-white transition hover:opacity-95 disabled:cursor-not-allowed disabled:opacity-60"
          >
            <span *ngIf="!isLoading">{{ isLoginMode ? 'Sign In' : 'Create Account' }}</span>
            <span *ngIf="isLoading" class="animate-pulse">Loading...</span>
          </button>

          <div class="mt-6 flex items-center gap-3">
            <span class="h-px flex-1 bg-[rgba(255,255,255,0.1)]"></span>
            <span class="text-[12px] uppercase tracking-[0.4px] text-[rgba(255,255,255,0.45)]">or continue with</span>
            <span class="h-px flex-1 bg-[rgba(255,255,255,0.1)]"></span>
          </div>

          <div class="mt-5 grid grid-cols-2 gap-3">
            <button
              type="button"
              class="flex items-center justify-center gap-2 rounded-[10px] border border-[rgba(255,255,255,0.1)] bg-[rgba(255,255,255,0.06)] px-4 py-3 text-sm font-medium text-[rgba(255,255,255,0.65)] transition hover:border-[rgba(255,255,255,0.18)]"
            >
              <span class="inline-flex h-5 w-5 items-center justify-center rounded bg-white/10">G</span>
              Google
            </button>
            <button
              type="button"
              class="flex items-center justify-center gap-2 rounded-[10px] border border-[rgba(255,255,255,0.1)] bg-[rgba(255,255,255,0.06)] px-4 py-3 text-sm font-medium text-[rgba(255,255,255,0.65)] transition hover:border-[rgba(255,255,255,0.18)]"
            >
              <span class="inline-flex h-5 w-5 items-center justify-center rounded bg-white/10">GH</span>
              GitHub
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
